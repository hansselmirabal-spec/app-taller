open_decisions:
  - id: pausa-libera-tecnico-scope
    question: >
      Does "pausa libera técnico" require touching BodyshopProcessTech / making
      the technician disappear from capacity-availability screens while paused
      (structural), or is it scoped purely to the resume-time confirm/change UX
      plus the tracking_log's own technicianId (UX-only)?
    status: resolved
    decision: >
      STRUCTURAL (full scope). On pause, the technician must disappear from
      "occupied" on capacity/availability screens (getTechnicianAvailability,
      getDayCapacity, etc.) — not just gain a confirm/change step on resume.
      Requires touching both tracking.service.ts AND bodyshop.service.ts
      (BodyshopProcessTech release/re-assignment).
